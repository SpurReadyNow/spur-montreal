<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPUR Montreal | Ready Now</title>
    <!-- PWA & Mobile Optimization Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Language Toggle Styles */
        .lang-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 4px;
            transition: color 0.2s ease;
        }

        .lang-toggle button.active {
            color: #ffffff;
        }

        .lang-toggle span {
            color: #555;
            margin: 0 4px;
            font-size: 13px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0a0a0a;
            background-color: #f5f5f7;
            padding: 6px 12px;
            border-radius: 4px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            color: #888;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        /* Action Button */
        .cta-btn {
            display: block;
            width: 100%;
            background-color: #f5f5f7;
            color: #0a0a0a;
            font-size: 16px;
            font-weight: 600;
            padding: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            text-decoration: none;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .cta-btn:hover {
            background-color: #ffffff;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Language Toggle (Top Right Corner) -->
    <div class="lang-toggle">
        <button onclick="switchLanguage('en')" id="btn-en" class="active">EN</button>
        <span>|</span>
        <button onclick="switchLanguage('fr')" id="btn-fr">FR</button>
    </div>

    <div class="container">
        <!-- Tagline Badge -->
        <div class="badge" data-en="Montreal • Plateau-Mont-Royal" data-fr="Montréal • Plateau-Mont-Royal">
            Montreal • Plateau-Mont-Royal
        </div>

        <!-- Main Title -->
        <h1 data-en="Ready Now™" data-fr="Prêt Maintenant™">
            Ready Now™
        </h1>

        <!-- Subtitle Description -->
        <p data-en="One-tap precision grooming. No searching, no waiting lists, no friction." data-fr="Coiffure de précision en un clic. Pas de recherche, pas de listes d'attente, zéro friction.">
            One-tap precision grooming. No searching, no waiting lists, no friction.
        </p>

        <!-- Main Action Button -->
        <button class="cta-btn" onclick="triggerConcierge()" data-en="Get Matched Now" data-fr="Être jumelé maintenant">
            Get Matched Now
        </button>

        <div class="footer-note" data-en="Concierge Service Model" data-fr="Modèle de service concierge">
            Concierge Service Model
        </div>
    </div>

    <script>
        // Language switching logic
        function switchLanguage(lang) {
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');

            // Swap all elements containing data-en attributes
            const elements = document.querySelectorAll('[data-en]');
            elements.forEach(el => {
                if (lang === 'fr') {
                    el.innerText = el.getAttribute('data-fr');
                } else {
                    el.innerText = el.getAttribute('data-en');
                }
            });

            // Save user choice locally
            localStorage.setItem('spur_montreal_lang', lang);
        }

        // Action trigger function (hook this up to your booking flow or WhatsApp/SMS concierge line)
        function triggerConcierge() {
            const currentLang = localStorage.getItem('spur_montreal_lang') || 'en';
            if (currentLang === 'fr') {
                alert("Connexion au concierge SPUR Montréal en cours...");
            } else {
                alert("Connecting to SPUR Montreal concierge...");
            }
        }

        // Auto-load saved language preference on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('spur_montreal_lang') || 'en';
            switchLanguage(savedLang);
        });
    </script>
</body>
</html>
