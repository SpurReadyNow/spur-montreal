<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPUR Montreal | Ready Now™</title>
    <!-- PWA & Mobile Optimization Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Language Toggle Styles (Top Right Corner) */
        .lang-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            background: rgba(22, 22, 22, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            z-index: 10;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 4px;
            transition: color 0.2s ease;
        }

        .lang-toggle button.active {
            color: var(--gold);
        }

        .lang-toggle span {
            color: #444;
            margin: 0 4px;
            font-size: 13px;
        }

        /* Main App Container */
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .location-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            background-color: rgba(212, 175, 55, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Action Button */
        .ready-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #0d0d0d;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            text-decoration: none;
            margin-bottom: 16px;
        }

        .ready-btn:active {
            transform: scale(0.98);
        }

        .ready-btn:hover {
            opacity: 0.95;
        }

        .status-box {
            font-size: 13px;
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.05);
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            margin-top: 15px;
            display: none;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #666;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Language Toggle (Top Right Corner) -->
    <div class="lang-toggle">
        <button onclick="switchLanguage('en')" id="btn-en" class="active">EN</button>
        <span>|</span>
        <button onclick="switchLanguage('fr')" id="btn-fr">FR</button>
    </div>

    <div class="container">
        <!-- Location Badge -->
        <div class="location-tag" data-en="Montreal • Plateau-Mont-Royal" data-fr="Montréal • Plateau-Mont-Royal">
            Montreal • Plateau-Mont-Royal
        </div>

        <!-- Title -->
        <h1 data-en="Ready Now™" data-fr="Prêt Maintenant™">
            Ready Now™
        </h1>

        <!-- Subtitle -->
        <p class="subtitle" data-en="One-tap precision grooming. No waiting lists, no friction, pure execution." data-fr="Coiffure de précision en un clic. Pas de listes d'attente, zéro friction, exécution pure.">
            One-tap precision grooming. No waiting lists, no friction, pure execution.
        </p>

        <!-- Action Button -->
        <button class="ready-btn" onclick="triggerMatching()" data-en="Get Matched Now" data-fr="Être jumelé maintenant">
            Get Matched Now
        </button>

        <!-- Dynamic Feedback Box -->
        <div id="statusBox" class="status-box" data-en="Connecting to Montreal concierge network..." data-fr="Connexion au réseau de conciergerie de Montréal...">
            Connecting to Montreal concierge network...
        </div>

        <div class="footer-note" data-en="Concierge Service Model" data-fr="Modèle de service concierge">
            Concierge Service Model
        </div>
    </div>

    <script>
        // Language switching engine
        function switchLanguage(lang) {
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');

            // Swap all translatable tags
            const elements = document.querySelectorAll('[data-en]');
            elements.forEach(el => {
                if (lang === 'fr') {
                    el.innerText = el.getAttribute('data-fr');
                } else {
                    el.innerText = el.getAttribute('data-en');
                }
            });

            // Save user preference
            localStorage.setItem('spur_montreal_lang', lang);
        }

        // Interactive matching trigger
        function triggerMatching() {
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            
            // Simulate the concierge handshake
            setTimeout(() => {
                const currentLang = localStorage.getItem('spur_montreal_lang') || 'en';
                if (currentLang === 'fr') {
                    statusBox.innerText = "✓ Styleur assigné. Redirection vers la ligne directe...";
                } else {
                    statusBox.innerText = "✓ Stylist matched. Redirecting to direct line...";
                }
            }, 1200);
        }

        // Auto-load saved language on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('spur_montreal_lang') || 'en';
            switchLanguage(savedLang);
        });
    </script>
</body>
</html>
