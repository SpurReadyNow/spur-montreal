<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPUR Montreal | Show Up Ready</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d0d">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: #141414;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        /* Top Header Area (Logo & Top-Right Controls) */
        .header-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .logo-area h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 6px;
        }

        .logo-area span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* Top Right Group (Live Badge + Language Toggle) */
        .top-right-controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }

        /* Language Toggle (EN | FR) */
        .lang-toggle {
            display: flex;
            align-items: center;
            background: rgba(212, 175, 55, 0.08);
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 3px;
            transition: color 0.2s ease;
        }

        .lang-toggle button.active {
            color: var(--gold);
        }

        .lang-toggle span {
            color: #555;
            margin: 0 3px;
            font-size: 11px;
        }

        /* Main Content Block */
        .main-content {
            width: 100%;
            max-width: 440px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .hero-title-gold {
            font-size: 32px;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            color: var(--gold);
        }

        /* Step List */
        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .step-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: rgba(212, 175, 55, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            flex-shrink: 0;
            font-size: 16px;
        }

        .step-text {
            font-size: 18px;
            color: var(--text-main);
            font-weight: 400;
        }

        /* Pilot Box */
        .pilot-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pilot-label-top {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .pilot-label-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        .pilot-price-area {
            text-align: right;
        }

        .pilot-price {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .pilot-code-link {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .pilot-code-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header-container">
        <div class="logo-area">
            <h1>SPUR</h1>
            <span data-en="SHOW UP READY™" data-fr="PRÊT À L'EMPLOI™">SHOW UP READY™</span>
        </div>
        <div class="top-right-controls">
            <!-- Live Status Badge -->
            <div class="live-badge">
                <div class="live-dot"></div>
                <span data-en="Plateau: Live" data-fr="Plateau : Actif">Plateau: Live</span>
            </div>
            <!-- Language Toggle -->
            <div class="lang-toggle">
                <button onclick="switchLanguage('en')" id="btn-en" class="active">EN</button>
                <span>|</span>
                <button onclick="switchLanguage('fr')" id="btn-fr">FR</button>
            </div>
        </div>
    </div>

    <!-- Main Content Section -->
    <div class="main-content">
        <div class="hero-title" data-en="You don't need to know what will make you look better." data-fr="Vous n'avez pas besoin de savoir ce qui vous mettra en valeur.">
            You don't need to know what will make you look better.
        </div>

        <div class="hero-title-gold" data-en="That's what we're here for." data-fr="C'est exactement pour cela que nous sommes là.">
            That's what we're here for.
        </div>

        <!-- 4 Steps -->
        <div class="steps-list">
            <div class="step-item">
                <div class="step-icon">👤</div>
                <div class="step-text" data-en="We find your specialist." data-fr="Nous trouvons votre spécialiste.">We find your specialist.</div>
            </div>
            <div class="step-item">
                <div class="step-icon">🔍</div>
                <div class="step-text" data-en="They know exactly what you need." data-fr="Ils savent exactement ce dont vous avez besoin.">They know exactly what you need.</div>
            </div>
            <div class="step-item">
                <div class="step-icon">✓</div>
                <div class="step-text" data-en="You approve." data-fr="Vous approuvez.">You approve.</div>
            </div>
            <div class="step-item">
                <div class="step-icon">✨</div>
                <div class="step-text" data-en="You get ready." data-fr="Vous vous préparez.">You get ready.</div>
            </div>
        </div>

        <!-- Pilot Flat Rate Card -->
        <div class="pilot-box">
            <div>
                <div class="pilot-label-top" data-en="Pilot Flat Rate" data-fr="Tarif Fixe Pilote">Pilot Flat Rate</div>
                <div class="pilot-label-sub" data-en="Complete grooming & styling" data-fr="Coiffure et style complets">Complete grooming & styling</div>
            </div>
            <div class="pilot-price-area">
                <div class="pilot-price">$49.99 CAD</div>
                <a href="#" class="pilot-code-link" data-en="+ HAVE SPurtan CODE?" data-fr="+ AVEZ-VOUS UN CODE SPURTAN?">+ HAVE SPurtan CODE?</a>
            </div>
        </div>
    </div>

    <script>
        // Language switching script
        function switchLanguage(lang) {
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');

            const elements = document.querySelectorAll('[data-en]');
            elements.forEach(el => {
                if (lang === 'fr') {
                    el.innerText = el.getAttribute('data-fr');
                } else {
                    el.innerText = el.getAttribute('data-en');
                }
            });

            localStorage.setItem('spur_montreal_lang', lang);
        }

        // Auto-load preferred language on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('spur_montreal_lang') || 'en';
            switchLanguage(savedLang);
        });
    </script>
</body>
</html>
